name: Build BloodMC apps
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags: ["v*"]
permissions:
  contents: read
jobs:
  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - name: Install dependencies
        run: npm install
      - name: Generate Android project and bundle app UI
        env:
          BLOODMC_APP_URL: https://bloodmc-control-center-v2.onrender.com
        run: |
          node scripts/write-app-config.js
          node scripts/prepare-www.js
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BloodMC-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
  windows:
    name: Windows EXE
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install dependencies
        run: npm install
      - name: Build installer
        env:
          BLOODMC_APP_URL: https://bloodmc-control-center-v2.onrender.com
        run: |
          npm run build:windows
      - uses: actions/upload-artifact@v4
        with:
          name: BloodMC-Windows-EXE
          path: release/*.exe
          if-no-files-found: error
